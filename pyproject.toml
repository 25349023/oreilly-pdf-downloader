[project]
name = "oreilly-pdf-downloader"
version = "1.0.0"
description = "A tool to download O'Reilly ebooks as PDF format"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dacite>=1.9.2",
    "jinja2>=3.1.6",
    "jupyterlab>=4.5.6",
    "playwright>=1.58.0",
    "pypdf>=6.10.2",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "types-requests>=2.33.0.20260408",
    "types-tqdm>=4.67.3.20260408",
]
